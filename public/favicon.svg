<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Outer Power Ring Accent -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="8 4" />

  <!-- Electric Lightning Bolt Icon -->
  <path d="M35 8 L18 34 H31 L27 56 L46 28 H32 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
